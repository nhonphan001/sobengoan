org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
android.useAndroidX=true

# Cấu hình Firebase cho app. Mặc định là project "demo-" chạy với Firebase emulator
# trên máy tính (máy ảo Android gọi tới máy tính qua 10.0.2.2).
# Khi có project Firebase thật: điền các giá trị trong Project settings › Your apps ›
# Android app (file google-services.json) vào đây.
sobengoan.firebase.projectId=demo-sobengoan
sobengoan.firebase.apiKey=demo-api-key
sobengoan.firebase.appId=1:000000000000:android:0000000000000000
sobengoan.firebase.databaseUrl=https://demo-sobengoan-default-rtdb.firebaseio.com
